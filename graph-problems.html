/* One drawing sheet, as in "Graph of Copies": the synthetic estate of 404 copies. Each lens on the left turns one question of the

    for (const l of LENSES) { const b = el("button", "lens"); b.dataset.lens = l.id; b.setAttribute("aria-pressed", String(l.id === st.lens)); b.appendChild(el("span", "no", String(l.no))); b.appendChild(el("span", "nm", l.name)); b.appendChild(el("span", "fig", "")); b.appendChild(el("span", "q", l.q + ` Sheet ${l.sheet}.`)); b.addEventListener("click", () => setLens(l.id, true)); nav.appendChild(b); }
    nav.appendChild(el("div", "foot", "Every answer is computed on the graph as it is drawn. “Inventory only” answers the same questions on the registered copies alone: risks become floors and coverages ceilings."));
  }
  function refreshFigs() { for (const b of $("lenses").querySelectorAll(".lens")) { const l = LENS[b.dataset.lens]; b.querySelector(".fig").textContent = l.fig(); b.setAttribute("aria-pressed", String(l.id === st.lens)); } }
  function redraw() { const l = LENS[st.lens]; l.show(false); refreshFigs(); $("svgSum").textContent = $("bannerText").textContent; }
  function show(play) { stopSeq(); const l = LENS[st.lens]; if (l.focus) fit(l.focus()); else fit(); l.show(play); refreshBar(); refreshFigs(); $("svgSum").textContent = $("bannerText").textContent; }
  function setLens(id, play) { if (st.lens !== id) { const old = LENS[st.lens]; if (old.leave) old.leave(); st.lens = id; } show(play); }
  $("invBtn").addEventListener("click", () => { st.inv = !st.inv; $("invBtn").setAttribute("aria-pressed", String(st.inv)); if (st.cutMode === "cut" || st.cutMode === "best4") st.cutMode = "paths"; st.ctl = new Set(); show(true); });

  // ---------------------------------------------------------------- pointing
  function pickAt(e) {
    const r = svg.getBoundingClientRect(), x = (e.clientX - r.left - view.tx) / view.k, y = (e.clientY - r.top - view.ty) / view.k, reach = (e.pointerType === "touch" ? 16 : 9) / view.k;
    let best = null, bd = reach * reach;
    for (let i = 0; i < N; i++) { if (!ok(i) || nodeEls[i].classList.contains("dim")) continue; const d = (pos[i][0] - x) ** 2 + (pos[i][1] - y) ** 2; if (d < bd) { bd = d; best = i; } }
    return best;
  }
  const hideTip = () => { tip.hidden = true; svg.classList.remove("over"); };
  svg.addEventListener("pointermove", (e) => { if (e.pointerType === "touch") return; const i = pickAt(e); if (i == null) { hideTip(); return; } svg.classList.add("over"); const n = NODES[i]; tip.firstChild.textContent = n.name; tip.lastChild.textContent = `${n.s}${n.reg ? ", in the inventory" : ", not in the inventory"}${n.loc ? ", on a personal machine" : ""}${n.partner ? ", read by a partner" : ""}. Level ${level[i]} of 3.` + (n.kap.length ? ` Key domain ${n.kap.join(", ")}.` : ""); tip.hidden = false; const ar = appEl.getBoundingClientRect(); let tx = e.clientX - ar.left + 14, ty = e.clientY - ar.top + 16; if (tx + tip.offsetWidth > ar.width - 8) tx = e.clientX - ar.left - tip.offsetWidth - 12; if (ty + tip.offsetHeight > ar.height - 8) ty = e.clientY - ar.top - tip.offsetHeight - 12; tip.style.left = tx + "px"; tip.style.top = ty + "px"; });
  svg.addEventListener("pointerleave", hideTip);
  document.addEventListener("pointermove", (e) => { if (!tip.hidden && !svg.contains(e.target)) hideTip(); });
  svg.addEventListener("click", (e) => {
    const i = pickAt(e); if (i == null) return; hideTip(); stopSeq();
    if (st.lens === "branch") { st.leaf = i; show(true); }
    else if (st.lens === "widest") { st.pick = st.pick === i ? null : i; show(false); }
    else if (st.lens === "cut") { if (st.cutMode !== "place") { st.cutMode = "place"; st.ctl = new Set(); } const cp = cutProblem(); if (cp.srcs.includes(i) || cp.sinks.includes(i)) return; if (st.ctl.has(i)) st.ctl.delete(i); else st.ctl.add(i); show(false); }
    else if (st.lens === "reach" && NODES[i].k === "source") { st.src = i; show(true); }
  });
  document.addEventListener("click", (e) => { const b = e.detail > 0 && e.target.closest && e.target.closest("button"); if (b) b.blur(); });

  // ---------------------------------------------------------------- the tour
  const tour = { i: -1, last: 0 }, tourBtn = $("tourBtn"), SS = "graph-problems-tour";
  const go = (lens, f) => () => { stopSeq(); if (f) f(); st.inv = false; $("invBtn").setAttribute("aria-pressed", "false"); setLens(lens, true); };
  const SCENES = [
    { title: "Erasure is reachability", again: true, go: go("reach", () => { st.src = 0; st.follow = false; }), say: () => { const r = reachFrom(0, false); return `A customer asks to be erased from the CRM. The request has to reach the ${r.data.length} copies that hold the customer's personal data. The inventory knows ${r.inv.length} of them.`; } },
    { title: "What a real request reaches", again: true, go: go("reach", () => { st.src = 0; st.follow = true; }), say: () => { const r = reachFrom(0, true), all = reachFrom(0, false); return `A request follows lineage through the inventory. Past a copy the inventory does not know, it stops: it reaches ${r.data.length} copies, and ${all.data.length - r.data.length} keep the data.`; } },
    { title: "The weakest link", again: true, go: go("branch", () => { st.leaf = 356; }), say: () => { const p = branchOf(356); return `One branch, from a source to a second model on an analyst's machine. Each copy passes 0 to 3 checks of custody; the chain is as thick as the level so far. It ends at level ${Math.min(...p.map((v) => level[v]))}: the branch is as protected as its weakest copy.`; } },
    { title: "The attacker's widest path", again: true, go: go("widest", () => { st.pick = null; }), say: () => { const b = widest(), k = NODES.filter((n, i) => personal(i)); const c0 = k.filter((n) => b[n.id] === 0).length; return `The defender solved a minimum. The attacker solves a maximum: for each copy, the best-protected route to it, and takes the easiest. ${c0} copies can be reached along a route with a copy that passes no check.`; } },
    { title: "Paths to a partner", again: true, go: go("cut", () => { st.cutMode = "paths"; st.ctl = new Set(); }), say: () => { const cp = cutProblem(); return `Personal data reach an external partner along ${cp.paths.length} paths from the sources, through ${cp.on.length} copies. Drawn by layers, from the sources on the left to the partner's copies on the right.`; } },
    { title: "Paths that share no copy", again: true, go: go("cut", () => { st.cutMode = "disjoint"; st.ctl = new Set(); }), say: () => { const cp = cutProblem(); return `${cp.flow} of the paths share no copy. A control closes the paths through its copy, so no ${cp.flow - 1} controls can close these ${cp.flow}: Menger's theorem, as a lower bound.`; } },
    { title: "The best four controls", go: go("cut", () => { st.cutMode = "best4"; }), say: () => { const cp = cutProblem(), b = bestK(4, cp); return `Four controls, wherever they are put: the best four close ${b.closed} of the ${cp.paths.length} paths and ${cp.paths.length - b.closed} stay open. Dashed paths are closed.`; } },
    { title: "The minimum cut", go: go("cut", () => { st.cutMode = "cut"; }), say: () => { const cp = cutProblem(); return `Five controls close all ${cp.paths.length} paths: a raw zone, two local environments, a model and an email attachment. The inventory lists ${cp.cut.filter((v) => NODES[v].reg).length} of the five. Place your own controls to try.`; } },
    { title: "The key decides what can be joined", again: true, go: go("keys", () => { st.reader = "Marketing analytics"; }), say: () => { const k = keysOf("Marketing analytics"); return `Marketing analytics reads ${k.reach.length} copies. Only copies with a pseudonym of the same key domain can be joined exactly: the largest group is ${k.largest}. Separate key domains refine this partition.`; } },
    { title: "Connections grow faster than copies", again: true, go: go("growth", () => { st.n = 12; }), say: () => `From 12 sources to ${N} copies. The share of pairs that share an ancestor rises from zero to ${pct(growthAt(N).pairs / growthAt(N).total * 100)}, and one component swallows the estate: percolation, with a mean out-degree of ${(E.length / N).toFixed(2)}.` },
    { title: "What the inventory sees", go: () => { stopSeq(); st.cutMode = "paths"; st.ctl = new Set(); st.inv = true; $("invBtn").setAttribute("aria-pressed", "true"); setLens("cut", false); }, say: () => `The same question on the inventory alone: no copy a partner reads is registered, so there is no path and nothing to cut. The estate looks sealed. An incomplete inventory does not err at random: it errs towards safety.` },
  ];
  function scene(k) {
    if (k < 0 || k >= SCENES.length) return;
    hideTip(); const sc = SCENES[k], again = k === tour.i; tour.i = tour.last = k;
    try { sessionStorage.setItem(SS, `${k}|${Date.now()}`); } catch (e) {}
    $("tourStep").textContent = `Scene ${k + 1} of ${SCENES.length}`; $("tourTitle").textContent = sc.title; $("tourText").textContent = sc.say();
    $("tourPrev").disabled = k === 0; $("tourNext").disabled = k === SCENES.length - 1; $("tourAgain").hidden = !sc.again || reduced;
    tourEl.hidden = false; appEl.classList.add("touring"); tourBtn.setAttribute("aria-pressed", "true");
    sc.go(); if (k === 9 && !reduced) playGrowth();
    requestAnimationFrame(() => { fit(); if (st.lens === "growth") drawChart(st.n); });
  }
  function endTour() {
    if (tour.i < 0) return;
    if (tour.i === SCENES.length - 1) tour.last = 0;
    try { sessionStorage.removeItem(SS); } catch (e) {}
    stopSeq(); hideTip(); tour.i = -1; tourEl.hidden = true; appEl.classList.remove("touring"); tourBtn.setAttribute("aria-pressed", "false");
    requestAnimationFrame(() => { fit(); show(false); });
  }
  tourBtn.addEventListener("click", () => (tour.i >= 0 ? endTour() : scene(0)));
  $("tourPrev").addEventListener("click", () => scene(tour.i - 1)); $("tourNext").addEventListener("click", () => scene(tour.i + 1)); $("tourAgain").addEventListener("click", () => scene(tour.i)); $("tourExit").addEventListener("click", endTour);
  document.addEventListener("keydown", (e) => {
    const t = e.target, field = /^(INPUT|SELECT)$/.test(t.tagName), mod = e.ctrlKey || e.metaKey || e.altKey; if (mod) return;
    if (tour.i >= 0) {
      const next = e.key === "PageDown" || (!field && ["ArrowRight", "ArrowDown", "n", "N"].includes(e.key)), prev = e.key === "PageUp" || (!field && ["ArrowLeft", "ArrowUp", "p", "P"].includes(e.key));
      if (next || prev) { e.preventDefault(); if (e.repeat) return; if (field) t.blur(); scene(tour.i + (next ? 1 : -1)); return; }
      if (e.key === "Escape") { endTour(); return; }
      if (e.key === " " && !field && t.tagName !== "BUTTON") { e.preventDefault(); if (e.repeat) return; if (st.lens === "growth") playGrowth(); else if (SCENES[tour.i].again) scene(tour.i); }
    } else if (e.key === "PageDown" || e.key === "PageUp") { e.preventDefault(); if (e.repeat) return; if (field) t.blur(); scene(Math.max(0, tour.last - (e.key === "PageUp" ? 1 : 0))); }
    else if (e.key === "Escape") { if (st.lens === "cut" && st.ctl.size) { st.ctl = new Set(); st.cutMode = "place"; show(false); } else if (st.lens === "widest" && st.pick != null) { st.pick = null; show(false); } }
    else if (e.key === " " && !field && t.tagName !== "BUTTON" && st.lens === "growth") { e.preventDefault(); if (!e.repeat) playGrowth(); }
  });

  // ---------------------------------------------------------------- zone references, start
  for (let k = 0; k < 8; k++) for (const top of [true, false]) { const z = el("span", "zone", String(k + 1)); z.style.left = (k + .5) / 8 * 100 + "%"; z.style[top ? "top" : "bottom"] = "-13px"; if (!top) z.style.transform = "translate(-50%, 50%)"; $("frame").appendChild(z); }
  for (let k = 0; k < 4; k++) for (const left of [true, false]) { const z = el("span", "zone", "ABCD"[k]); z.style.top = (k + .5) / 4 * 100 + "%"; z.style[left ? "left" : "right"] = "-13px"; if (!left) z.style.transform = "translate(50%, -50%)"; $("frame").appendChild(z); }
  renderLenses(); place(); fit(); show(false);
  if (window.ResizeObserver) new ResizeObserver(() => { fit(); if (st.lens === "growth") drawChart(st.n); }).observe($("plot")); else window.addEventListener("resize", () => { fit(); if (st.lens === "growth") drawChart(st.n); });
  try { const m = /^(\d+)\|(\d+)$/.exec(sessionStorage.getItem(SS) || ""); if (m && +m[1] < SCENES.length && Date.now() - +m[2] < 3 * 3600 * 1000) scene(+m[1]); } catch (e) {}
})();
</script>
