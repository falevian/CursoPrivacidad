<style>
/* Layout: one drawing sheet that fills the screen, as in "Graph of Copies". On the left, what a release carries, attribute by

   bits against risk. The strip of bits under the map is the abscissa of the release, split by attribute. */
:root {
  color-scheme: dark;
  --sheet: #0F3A68;          /* the blueprint sheet of the deck */
  --sheet-deep: #082448;
  --panel: #0A2B50;
  --panel-2: #0E3560;
  --ink: #FFFFFF;
  --ink-2: #BFD9F2;          /* secondary lettering */
  --ink-3: #8FB3D9;          /* captions */
  --rule: rgba(255, 255, 255, .86);
  --rule-soft: rgba(191, 217, 242, .28);
  --grid-minor: rgba(255, 255, 255, .04);
  --grid-major: rgba(255, 255, 255, .095);
  --accent: #FFD166;         /* emphasis, as in the deck: the release under study and the maximum risk */
  --accent-ink: #1B2A00;
  --font: "Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --m: 26px;                 /* margin between the edge of the sheet and the drawing frame */
  --fs: clamp(14.5px, 1.02vw, 22px);      /* lettering of the bench */
}
html, body { height: 100%; }
body { margin: 0; background: var(--sheet-deep); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.35; overflow: hidden; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.app { position: relative; height: 100%; box-sizing: border-box; overflow: hidden; overflow: clip;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px;
  padding: calc(var(--m) + 14px) calc(var(--m) + 20px) calc(var(--m) + 12px);
  background:
    linear-gradient(var(--grid-major) 1px, transparent 1px) var(--m) var(--m) / 96px 96px,
    linear-gradient(90deg, var(--grid-major) 1px, transparent 1px) var(--m) var(--m) / 96px 96px,
    linear-gradient(var(--grid-minor) 1px, transparent 1px) var(--m) var(--m) / 24px 24px,
    linear-gradient(90deg, var(--grid-minor) 1px, transparent 1px) var(--m) var(--m) / 24px 24px,
    radial-gradient(ellipse at center, var(--sheet) 0%, var(--sheet-deep) 118%);
}
.frame { position: absolute; inset: var(--m); border: 1.5px solid var(--rule); pointer-events: none; }
.zone { position: absolute; font-size: 10px; color: var(--ink-2); opacity: .8; pointer-events: none; transform: translate(-50%, -50%); }

/* the lettering at the top of the sheet */
.head { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: flex-start; justify-content: space-between; min-width: 0; }
.title { min-width: 0; flex: 1 1 18em; }
h1 { margin: 0; font-weight: 400; font-size: clamp(20px, 2.3vw, 30px); letter-spacing: .085em; text-transform: uppercase; line-height: 1.1; }
.lede { margin: 6px 0 0; color: var(--ink-2); font-size: 15px; max-width: 46em; }
.tools { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: flex-end; min-width: 0; }
.btn { background: rgba(8, 36, 72, .82); border: 1px solid var(--rule-soft); border-radius: 3px; padding: 6px 12px; line-height: 1.1; min-height: 34px; color: var(--ink); }
.btn:hover { border-color: var(--ink-2); }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--sheet-deep); border-color: var(--ink); }
.btn.go { background: var(--ink); color: var(--sheet-deep); border-color: var(--ink); font-weight: 500; }
.btn:disabled { opacity: .4; cursor: default; }
.steps { display: flex; }
.steps .btn { border-radius: 0; margin-left: -1px; font-size: 17px; padding: 6px 14px; }
.steps .btn:first-child { border-radius: 3px 0 0 3px; margin-left: 0; }
.steps .btn:last-child { border-radius: 0 3px 3px 0; }
.steps .no { color: var(--ink-3); font-variant-numeric: tabular-nums; margin-right: 5px; }
.steps .btn[aria-pressed="true"] .no { color: inherit; opacity: .6; }

.work { display: grid; grid-template-columns: clamp(322px, 25.5vw, 480px) minmax(0, 1fr); gap: 18px; min-height: 0; min-width: 0; }

/* the bench: what is released */
.bench { display: flex; flex-direction: column; min-height: 0; overflow-y: auto; overscroll-behavior: contain; box-sizing: border-box; border: 1.5px solid var(--rule); background: rgba(10, 43, 80, .72); font-size: var(--fs); padding: 10px 14px 12px; scrollbar-width: thin; scrollbar-color: var(--rule-soft) transparent; }
.bench > * { flex: none; }
.bh { margin: 0 0 8px; font-size: 1.22em; font-weight: 500; line-height: 1.2; }
.blk { margin: 0 0 9px; }
.cap { display: block; color: var(--ink-3); font-size: .86em; margin: 0 0 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: rgba(8, 36, 72, .7); border: 1px solid var(--rule-soft); border-radius: 3px; padding: 3px 9px; min-height: 28px; line-height: 1.15; color: var(--ink); font-size: .95em; }
.chip:hover { border-color: var(--ink-2); }
.chip[aria-pressed="true"] { border-color: var(--ink); background: rgba(255, 255, 255, .14); }
.seg { display: inline-flex; border: 1px solid var(--rule-soft); border-radius: 3px; overflow: hidden; vertical-align: middle; }
.seg label { position: relative; display: block; }
.seg input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.seg span { display: block; box-sizing: border-box; min-width: 1.95em; min-height: 28px; padding: 4px 5px; text-align: center; line-height: 1.25; font-variant-numeric: tabular-nums; border-left: 1px solid var(--rule-soft); white-space: nowrap; }
.seg label:first-child span { border-left: 0; }
.seg label:hover span { background: rgba(255, 255, 255, .1); }
.seg input:checked + span { background: var(--ink); color: var(--sheet-deep); font-weight: 500; }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: -2px; }
.seg input:disabled { cursor: default; }
.seg input:disabled + span { opacity: .45; }
.seg label:hover input:disabled + span { background: none; }
.seg label:hover input:disabled:checked + span { background: var(--ink); }
.tabs { display: flex; margin: 0 0 10px; }
.tabs .seg { flex: 1; }
.tabs .seg label { flex: 1; }
.tabs .seg span { padding: 6px 8px; font-size: 1.05em; }
.line .seg span { padding: 4px 9px; }
.rows { margin: 0 0 4px; }
.rowh, .row { display: grid; grid-template-columns: minmax(4.2em, 1fr) auto 4.3em; gap: 0 9px; align-items: center; }
.rows.m .rowh, .rows.m .row { grid-template-columns: 1.3em 1.25em minmax(0, 1fr) 3.2em 3.2em; gap: 0 6px; }
.rowh { color: var(--ink-3); font-size: .86em; padding: 0 0 3px; border-bottom: 1px solid var(--rule-soft); }
.rowh span:last-child, .row .bt, .row .vl, .rows.m .rowh span:nth-child(4) { text-align: right; }
.row { padding: 3px 0; min-height: 30px; box-sizing: content-box; border-bottom: 1px solid rgba(191, 217, 242, .12); }
.rows.m .row { cursor: pointer; }
.rows.m .row:hover { background: rgba(255, 255, 255, .05); }
.row .nm { min-width: 0; line-height: 1.08; }
.row .bt, .row .vl { font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }
.row .bt b { color: var(--ink); font-weight: 500; }
.row .cp { color: var(--ink-3); text-align: center; }
.row.off .nm, .row.off .bt b { color: var(--ink-3); }
.row input[type="checkbox"], .check input { width: 1.05em; height: 1.05em; margin: 0; accent-color: var(--accent); cursor: pointer; }
.grp { margin: 7px 0 1px; color: var(--ink-3); font-size: .86em; }
.check { display: flex; gap: 8px; align-items: center; min-height: 30px; cursor: pointer; line-height: 1.2; }
.line { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.line .cap { margin: 0; }
.pram { display: grid; grid-template-columns: auto minmax(0, 1fr) 2.9em; gap: 10px; align-items: center; margin-top: 7px; }
.pram output { text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }
.say2 { margin: 6px 0 0; color: var(--ink-2); font-size: .9em; line-height: 1.3; }
/* measure: the smallest set of attributes that singles out each customer, as on the sheet of the deck */
.bench > .msu { flex: 1 1 150px; min-height: 132px; max-height: 300px; display: flex; flex-direction: column; margin-top: 9px; padding-top: 7px; border-top: 1px solid var(--rule-soft); }
.msu .cap { flex: none; color: var(--ink); font-size: .95em; line-height: 1.2; margin: 0 0 2px; }
.msu svg { flex: 1; min-height: 0; width: 100%; display: block; overflow: visible; }
.msu svg text { font-family: var(--font); fill: var(--ink-2); font-variant-numeric: tabular-nums; }
.msu .bar { fill: var(--ink-2); }
.msu .bar.few { fill: var(--accent); }
.msu .bar.never { fill: none; stroke: var(--ink-2); stroke-width: 1.2; stroke-dasharray: 3 2.5; }
.msu .base { stroke: var(--rule); stroke-width: 1.2; }
.msu text.v { fill: var(--ink); }
.msu text.v.few { fill: var(--accent); }
.msu .say2 { flex: none; margin: 2px 0 0; }
.msu.hl .cap { color: var(--accent); }
input[type="range"] { -webkit-appearance: none; appearance: none; display: block; width: 100%; height: 22px; margin: 0; padding: 0; background: none; cursor: pointer; --p: 50%; }
input[type="range"]::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: linear-gradient(90deg, var(--accent) var(--p), var(--rule-soft) var(--p)); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6.5px; border: 0; border-radius: 50%; background: var(--accent); }
input[type="range"]::-moz-range-track { height: 3px; border-radius: 2px; background: var(--rule-soft); }
input[type="range"]::-moz-range-progress { height: 3px; border-radius: 2px; background: var(--accent); }
input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border: 0; border-radius: 50%; background: var(--accent); }

/* what comes out: the measures, and the map */
.stage { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.cells { flex: none; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 1px; background: var(--rule); border: 1.5px solid var(--rule); }
.cell { position: relative; display: flex; flex-direction: column; gap: 1px; min-width: 0; padding: 6px 12px 8px; background: var(--sheet); }
.cell .dt { font-size: clamp(10px, .72vw, 13px); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell .dt .sm, .cells.tight .dt .lg { display: none; }
.cells.tight .dt .sm { display: inline; }
.cells.tight .cell { padding-left: 8px; padding-right: 8px; }
.cell .dd { font-size: clamp(22px, 2.05vw, 40px); font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: .01em; line-height: 1.12; white-space: nowrap; }
.cell .aux { font-size: clamp(12.5px, .92vw, 17px); color: var(--ink-2); font-variant-numeric: tabular-nums; line-height: 1.25; }
.cell.main .dd { color: var(--accent); }
.cell.over::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--accent); }
.plot { position: relative; flex: 1; min-height: 0; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
#map.over { cursor: pointer; }
#map text { font-family: var(--font); fill: var(--ink-2); font-variant-numeric: tabular-nums; }
#map .halo { paint-order: stroke; stroke: var(--sheet-deep); stroke-width: 4px; stroke-linejoin: round; }
#map .grid { stroke: var(--rule-soft); stroke-width: 1; }
#map .axis { stroke: var(--rule); stroke-width: 1.5; fill: none; }
#map .guide { fill: none; stroke: var(--ink-3); stroke-width: 1.2; stroke-dasharray: 2 4; }
#map .vline { stroke: var(--ink-2); stroke-width: 1.1; stroke-dasharray: 1.5 4; }
#map .thr { stroke: var(--accent); stroke-width: 1.8; stroke-dasharray: 9 6; }
#map text.thrl { fill: var(--accent); font-weight: 500; }
#map .ghost { fill: var(--ink-2); opacity: .5; }
#map .ghost.front { fill: var(--ink); opacity: .95; }
#map .frontl { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linejoin: round; }
#map .pramc { fill: none; stroke: var(--ink-2); stroke-width: 1.4; stroke-dasharray: 5 4; }
#map .pramt { fill: var(--ink-2); }
#map .cand { fill: var(--ink); stroke: var(--sheet-deep); stroke-width: 1.5; }
#map .cand.hollow { fill: var(--sheet-deep); stroke: var(--ink); stroke-width: 2; }
#map text.nm { fill: var(--ink); }
#map text.val { fill: var(--accent); font-weight: 600; }
#map .live { fill: var(--accent); stroke: var(--sheet-deep); stroke-width: 2.2; }
#map .live.floor { fill: var(--sheet-deep); stroke: var(--accent); }
#map .drop { stroke: var(--accent); stroke-width: 1; stroke-dasharray: 2 3; opacity: .8; }
#map .trail { fill: none; stroke: var(--accent); stroke-width: 1.3; opacity: .75; }
#map .trailp { fill: var(--sheet-deep); stroke: var(--accent); stroke-width: 1.5; }
#map .link { stroke: var(--ink); stroke-width: 1.3; stroke-dasharray: 5 4; fill: none; }
#map .lead { stroke: var(--ink-2); stroke-width: 1; }
#map .sg { stroke: var(--sheet-deep); stroke-width: 1; }
#map .sg.need, #map .sg.plain { fill: var(--ink-2); }
#map .sg.extra { fill: url(#hatch); stroke: var(--rule-soft); }
#map .sg.shared { fill: var(--accent); }
#map text.sgt { fill: var(--sheet-deep); font-weight: 500; pointer-events: none; }
#map text.sgt.lite { fill: var(--ink); }
#map text.tot { fill: var(--ink); font-weight: 500; }
.fail { margin: 12px 0; color: var(--accent); font-size: 18px; max-width: 34em; }

.tip { position: absolute; z-index: 9; pointer-events: none; background: var(--panel); border: 1px solid var(--rule-soft); border-radius: 3px; padding: 6px 10px; max-width: 24em; box-shadow: 0 6px 18px rgba(0, 0, 0, .35); }
.tip b { font-weight: 500; display: block; }
.tip span { color: var(--ink-2); font-size: 14px; display: block; }

/* the guided tour: a caption strip along the bottom of the sheet, one scene at a time */
.foot { min-width: 0; }
.tour-in { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; background: var(--panel); border: 1.5px solid var(--rule); border-radius: 3px; padding: 9px 12px 10px 16px; }
.tour .txt { flex: 1 1 24em; min-width: 0; }
.tour .top { display: flex; gap: 10px; align-items: baseline; margin: 0 0 2px; }
.tour .step { margin: 0; color: var(--ink-3); font-size: clamp(13px, .9vw, 17px); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tour h2 { margin: 0; font-size: clamp(19px, 1.45vw, 28px); font-weight: 500; line-height: 1.2; }
.tour .say { margin: 0; color: var(--ink-2); font-size: clamp(16px, 1.25vw, 24px); line-height: 1.3; max-width: 66em; }      /* read from the back of a room */
.tour .acts { flex: none; display: flex; gap: 8px; align-items: center; }
.note { margin: 0; color: var(--ink-3); font-size: 13px; text-align: right; }
.touring .note { display: none; }

@media (min-width: 861px) {
  .tour .say { min-height: 2.6em; }                              /* two lines, so that the strip, and with it the map, keeps its size from scene to scene */
}
@media (min-width: 861px) and (max-height: 800px) {      /* a projector of 720 or 768 lines: the bench has to fit above the caption strip */
  :root { --fs: clamp(13.6px, 1.02vw, 15px); }
  .lede { display: none; }
  .row { min-height: 26px; padding: 2px 0; }
  .seg span { min-height: 25px; padding: 3px 5px; }
  .chip { min-height: 25px; padding: 2px 6px; font-size: .92em; }
  .chips { gap: 5px; }
  .bench { padding: 7px 12px 7px; }
  .bh { margin-bottom: 5px; font-size: 1.15em; }
  .blk { margin-bottom: 6px; }
  .blk > .cap, .pram + .say2 { display: none; }
  .bench > .msu { margin-top: 5px; padding-top: 5px; min-height: 118px; }
  .rows.m .row { min-height: 23px; }
  .msu .say2 { font-size: .86em; }
  .grp { margin: 4px 0 0; }
  .check { min-height: 26px; }
  .tabs { margin-bottom: 6px; }
  .tabs .seg span { padding: 4px 8px; }
  .app { gap: 10px; }
}
@media (min-width: 861px) and (max-height: 640px) {      /* the same projector with the bars of the browser on: the map needs every line */
  .cell { padding: 4px 10px 5px; }
  .cell:not(.main) .aux, .cell.main .aux:not(:last-child) { display: none; }
  .app { gap: 8px; padding-top: calc(var(--m) + 9px); padding-bottom: calc(var(--m) + 8px); }
  .tour-in { padding: 6px 10px 7px 14px; }
  .note { display: none; }
}
@media (max-width: 860px) {
  :root { --m: 8px; --fs: 15.5px; }
  .zone { display: none; }
  .app { padding: 16px 14px 12px; gap: 8px; }
  .lede { display: none; }
  .tools { justify-content: flex-start; width: 100%; }
  .steps { flex: 1; }
  .steps .btn { flex: 1; padding: 6px 6px; font-size: 16px; }
  .work { display: flex; flex-direction: column; gap: 8px; }
  .stage { order: 0; flex: none; gap: 8px; }
  .plot { flex: none; height: clamp(210px, 36vh, 340px); }
  .bench { order: 1; flex: 1; padding: 9px 11px 12px; }
  .cells { display: flex; flex-wrap: wrap; }
  .cell { flex: 1 1 30%; box-sizing: border-box; padding: 4px 8px 5px; }
  .cell.opt { display: none; }
  .cell .dd { font-size: 21px; }
  .cell .aux { font-size: 12.5px; }
  .cell.main .aux:not(:last-child), .touring .cell .aux { display: none; }      /* of the main cell, the line that says where the risk stands */
  .touring .bench { display: none; }                             /* on a phone the tour needs the room: the map takes it */
  .tour .say { max-height: 6.6em; overflow-y: auto; }
  .touring .stage { flex: 1; min-height: 0; }
  .touring .plot { flex: 1; height: auto; min-height: 0; }
  .seg span { min-height: 32px; padding: 6px 8px; }
  .row { min-height: 36px; }
  .tour-in { padding: 8px 10px 9px 12px; gap: 6px 12px; }
  .tour .say { font-size: 15px; }
  .tour h2 { font-size: 18px; }
  .note { display: none; }
}
@media (max-width: 860px) and (max-height: 660px) { .touring .cells { display: none; } }      /* a small phone in the tour: the caption carries the figures */
@media (max-width: 860px) and (max-height: 520px) and (min-width: 540px) {      /* a phone held sideways: the bench beside the map */
  :root { --fs: 14px; }
  .app { padding: 12px 12px 10px; gap: 6px; }
  .head { flex-wrap: nowrap; align-items: center; }
  h1 { font-size: 18px; }
  .title { flex: 0 1 auto; }
  .tools { width: auto; flex: 1; flex-wrap: nowrap; justify-content: flex-end; }
  .steps { flex: 0 1 auto; }
  .steps .btn { flex: none; padding: 5px 10px; font-size: 15px; }
  .work { flex-direction: row; gap: 10px; }
  .bench { order: 0; flex: 0 0 43%; padding: 7px 9px 9px; }
  .stage { order: 1; flex: 1; min-height: 0; }
  .plot { flex: 1; height: auto; min-height: 0; }
  .cell { flex: 1 1 30%; padding: 3px 7px 4px; }
  .cell .dt { font-size: 9.5px; }
  .cell .dd { font-size: 18px; }
  .cell .aux { display: none; }
  .row { min-height: 30px; }
  .seg span { min-height: 28px; padding: 4px 6px; }
  .touring .cells { display: none; }
  .tour-in { padding: 5px 8px 6px 10px; }
  .tour .say { font-size: 14px; line-height: 1.25; }
  .tour h2 { font-size: 16px; }
  .tour .btn { min-height: 30px; padding: 4px 9px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<body>
<div class="app" id="app">
  <div class="frame" id="frame" aria-hidden="true"></div>

  <header class="head">
    <div class="title">
      <h1>Risk and utility</h1>
      <p class="lede">100,000 synthetic customers, eight attributes. Choose what a release carries: the page counts again how many customers an intruder can single out, and what the product loses.</p>
    </div>
    <div class="tools">
      <div class="steps" id="steps" role="group" aria-label="The three steps of the worked example">
        <button class="btn" data-step="measure" aria-pressed="true" title="Step 1: measure the file before any control"><span class="no">1</span>Measure</button>
        <button class="btn" data-step="control" aria-pressed="false" title="Step 2: apply controls for product 1 and calculate again"><span class="no">2</span>Control</button>
        <button class="btn" data-step="pair" aria-pressed="false" title="Step 3: two releases, and the actor who reads both"><span class="no">3</span>Pair</button>
      </div>
      <button class="btn" id="tourBtn" aria-pressed="false" title="Thirteen scenes, one at a time. Page Down and Page Up, or the arrow keys, move between them. Page Down also starts the tour, where it was left">Tour</button>
    </div>
  </header>

  <div class="work">
    <section class="bench" id="bench" aria-label="What is released"></section>
    <section class="stage" aria-label="What comes out">
      <div class="cells" id="cells"></div>
      <div class="plot" id="plot">
        <svg id="map" role="img" aria-labelledby="mapSum">
          <defs><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="rgba(8,36,72,.6)"/><rect width="1.6" height="5" fill="rgba(191,217,242,.8)"/></pattern></defs>
        </svg>
        <p class="sr" id="mapSum" aria-live="polite" aria-atomic="true"></p>
      </div>
    </section>
  </div>

  <footer class="foot">
    <section class="tour" id="tour" aria-label="Guided tour" hidden>
      <div class="tour-in">
        <div class="txt">
          <div class="top"><p class="step" id="tourStep"></p><h2 id="tourTitle"></h2></div>
          <p class="say" id="tourText" aria-live="polite"></p>
        </div>

      go: () => { setCtl(minimal[0], false); r0.tech = "pram"; r0.pc = 100; st.trail = [];
                  const slide = (from, to, wait) => Array.from({ length: from - to }, (_, k) => [k ? 70 : wait, () => { r0.pc = from - k - 1; update(); }]);
                  return [...slide(100, 90, 900), ...slide(90, 70, 1800)]; } },
    { step: "control", title: "The threshold decides", say: () => `Score = (IL + DR) / 2. The lowest score, ${b1(score(0, MIN1.dr))}, belongs to the file that was only minimized, with ${WORDS[Math.round(MIN1.dr / MAX)]} times the risk allowed. The threshold decides. The score only orders what passes it.`,
      go: () => { setCtl(P[0].chosen, true); st.scores = true; st.trail = []; } },
    { step: "pair", title: "A second release", say: () => `Another team runs the same cycle for product 2: tariff, handset, gender, household and district. Risk ${pct(REC2.dr)}. Each release was measured against the original, as the methodology asks, and each one passes.`,
      go: () => { setPair(0, P[0].chosen, true); setPair(1, P[1].chosen, true); st.edit = 1; st.solo = true; st.sameKey = true; st.trail = []; } },
    { step: "pair", title: "The pair", say: () => `Both releases keep the same customer pseudonym. An actor who reads both holds the eight attributes again: ${b1(REC1.bits)} + ${b1(REC2.bits)} − ${b1(JOIN.shared)} shared = ${b1(JOIN.bits)} bits, above the ${b1(SINGLE)} that single out one customer. Risk ${pct(JOIN.dr)}.`,
      go: () => { setPair(0, P[0].chosen, true); setPair(1, P[1].chosen, true); st.edit = 1; st.sameKey = true; st.trail = []; } },
    { step: "pair", title: "Separate key domains", say: () => `With a different pseudonym in each release there is no exact join, and each release keeps its own risk. Keys decide what can be joined.`,
      go: () => { setPair(0, P[0].chosen, true); setPair(1, P[1].chosen, true); st.edit = 1; st.sameKey = false; st.trail = []; } },
    { step: "pair", title: "One budget for the pair", say: () => `If the pair, and not each release, has to stay under ${MAX}%, the best joint choice costs product 1 ${Math.round(C.loss(BUD1, P[0]).il)}% of its bits and product 2 ${Math.round(C.loss(BUD2, P[1]).il)}%: about twice what each gave up alone. Joined risk ${pct(JBUD.dr)}.`,
      go: () => { setPair(0, P[0].budget, false); setPair(1, P[1].budget, false); st.edit = 0; st.sameKey = true; st.trail = []; } },
  ];
  function scene(k) {
    if (k < 0 || k >= SCENES.length) return;
    stopSeq(); hideTip();
    const sc = SCENES[k], again = k === tour.i;
    tour.i = tour.last = k;
    try { sessionStorage.setItem(SS, `${k}|${Date.now()}`); } catch (e) {}
    st.ghost = true; st.scores = false; st.solo = false; st.mark = false; st.trail = []; st.step = sc.step;
    $("tourStep").textContent = `Scene ${k + 1} of ${SCENES.length}`; $("tourTitle").textContent = sc.title; $("tourText").textContent = sc.say();
    $("tourPrev").disabled = k === 0; $("tourNext").disabled = k === SCENES.length - 1; $("tourAgain").hidden = !sc.again || reduced;
    const was = tourEl.hidden; tourEl.hidden = false; appEl.classList.add("touring"); tourBtn.setAttribute("aria-pressed", "true");
    const then = sc.go();
    update(was || !again);
    if (then) runSeq(then);
  }
  function endTour(quiet) {
    if (tour.i < 0) return;
    if (tour.i === SCENES.length - 1) tour.last = 0;             // a tour that reached its end starts again from the first scene
    try { sessionStorage.removeItem(SS); } catch (e) {}
    stopSeq(); hideTip(); tour.i = -1; tourEl.hidden = true; appEl.classList.remove("touring"); tourBtn.setAttribute("aria-pressed", "false");
    st.ghost = true; st.scores = false; st.solo = false; st.mark = false;
    if (!quiet) update(true);
  }
  tourBtn.addEventListener("click", () => (tour.i >= 0 ? endTour() : scene(0)));
  $("tourPrev").addEventListener("click", () => scene(tour.i - 1));
  $("tourNext").addEventListener("click", () => scene(tour.i + 1));
  $("tourAgain").addEventListener("click", () => scene(tour.i));
  $("tourExit").addEventListener("click", () => endTour());

  document.addEventListener("keydown", (e) => {
    const t = e.target, field = t.tagName === "INPUT", mod = e.ctrlKey || e.metaKey || e.altKey;
    if (mod) return;
    if (tour.i >= 0) {                                            // a presenter remote sends Page Down and Page Up, or arrows: the first two work wherever the focus is
      const next = e.key === "PageDown" || (!field && ["ArrowRight", "ArrowDown", "n", "N"].includes(e.key)), prev = e.key === "PageUp" || (!field && ["ArrowLeft", "ArrowUp", "p", "P"].includes(e.key));
      if (next || prev) { e.preventDefault(); if (e.repeat) return; if (field) t.blur(); scene(tour.i + (next ? 1 : -1)); return; }      // a key held down is one step
      if (e.key === "Escape") { endTour(); return; }
      if (e.key === " " && !field && t.tagName !== "BUTTON") { e.preventDefault(); if (!e.repeat && SCENES[tour.i].again) scene(tour.i); }
    } else if (e.key === "PageDown" || e.key === "PageUp") {      // outside the tour the remote starts it, at the scene where it was left
      e.preventDefault(); if (e.repeat) return; if (field) t.blur(); scene(Math.max(0, tour.last - (e.key === "PageUp" ? 1 : 0)));
    }
  });

  // ---------------------------------------------------------------- zone references of the drawing sheet
  for (let k = 0; k < 8; k++) for (const top of [true, false]) { const z = el("span", "zone", String(k + 1)); z.style.left = (k + .5) / 8 * 100 + "%"; z.style[top ? "top" : "bottom"] = "-13px"; if (!top) z.style.transform = "translate(-50%, 50%)"; frame.appendChild(z); }
  for (let k = 0; k < 4; k++) for (const left of [true, false]) { const z = el("span", "zone", "ABCD"[k]); z.style.top = (k + .5) / 4 * 100 + "%"; z.style[left ? "left" : "right"] = "-13px"; if (!left) z.style.transform = "translate(50%, -50%)"; frame.appendChild(z); }

  if (window.ResizeObserver) { new ResizeObserver(() => { if (M) drawMap(true); }).observe(plotEl); new ResizeObserver(() => { if (M) fitCells(); }).observe(cellsEl); new ResizeObserver(() => { if (M && st.step === "measure") drawMsu(); }).observe(benchEl); }
  else window.addEventListener("resize", () => { if (M) { drawMap(true); fitCells(); if (st.step === "measure") drawMsu(); } });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { widths = new Map(); if (M) { drawMap(true); fitCells(); if (st.step === "measure") drawMsu(); } });
  update(true);
  try {                                                         // back to the scene that was on show, if the page was reloaded in the middle of a tour
    const m = /^(\d+)\|(\d+)$/.exec(sessionStorage.getItem(SS) || "");
    if (m && +m[1] < SCENES.length && Date.now() - +m[2] < 3 * 3600 * 1000) scene(+m[1]);
  } catch (e) {}
})();
</script>

</body>
</html>
